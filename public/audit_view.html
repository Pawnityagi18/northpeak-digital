<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Razorpay Agentic Commerce - Audit Trail Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .title-group h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .title-group p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    .badge-track {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .search-input {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      width: 300px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
    }

    .btn-refresh {
      background: var(--accent-blue);
      color: #0f172a;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-refresh:hover {
      background: #0284c7;
      color: #fff;
    }

    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    th {
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-muted);
      font-weight: 600;
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.75rem;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      vertical-align: top;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .action-badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .action-PRODUCT_PROPOSED { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .action-CONFIRMATION_ATTEMPTED { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .action-ORDER_CREATED { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .action-GUARDRAIL_BLOCKED { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .action-PAYMENT_ATTEMPTED { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .action-PAYMENT_RESULT { background: rgba(236, 72, 153, 0.15); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }

    .outcome-SUCCESS { color: #4ade80; font-weight: 600; }
    .outcome-BLOCKED { color: #f87171; font-weight: 600; }
    .outcome-PENDING { color: #f59e0b; font-weight: 600; }

    .time-cell {
      color: var(--text-muted);
      font-family: monospace;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .code-block {
      background: #0f172a;
      padding: 0.5rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #cbd5e1;
      max-width: 320px;
      overflow-x: auto;
      border: 1px solid var(--border-color);
    }

    .empty-state {
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">
        <h1>🛡️ Razorpay Agentic Audit Trail</h1>
        <p>Explainable, bounded, and gated AI shopping agent event log</p>
      </div>
      <span class="badge-track">Razorpay AI Buildathon</span>
    </header>

    <div class="controls">
      <input type="text" id="convIdInput" class="search-input" placeholder="Filter by Conversation ID..." oninput="fetchAuditLogs()">
      <button class="btn-refresh" onclick="fetchAuditLogs()">↻ Refresh Logs</button>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Conv ID</th>
            <th>Action Type</th>
            <th>Reasoning (Explainability)</th>
            <th>Outcome</th>
            <th>Metadata</th>
          </tr>
        </thead>
        <tbody id="auditTableBody">
          <tr>
            <td colspan="6" class="empty-state">Loading audit trail data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function fetchAuditLogs() {
      const convFilter = document.getElementById('convIdInput').value.trim();
      let url = '/audit';
      if (convFilter) {
        url += '?conversation_id=' + encodeURIComponent(convFilter);
      }

      try {
        const res = await fetch(url);
        const logs = await res.json();
        renderTable(logs);
      } catch (err) {
        document.getElementById('auditTableBody').innerHTML = `
          <tr>
            <td colspan="6" class="empty-state" style="color: var(--accent-red);">
              Error loading audit logs: ${err.message}
            </td>
          </tr>`;
      }
    }

    function renderTable(logs) {
      const tbody = document.getElementById('auditTableBody');
      if (!logs || logs.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="empty-state">
              No audit log entries found. Perform a chat or checkout interaction to generate logs.
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = logs.map(entry => {
        const actionClass = 'action-' + (entry.action_type || 'DEFAULT');
        const outcomeClass = 'outcome-' + (entry.outcome || 'INFO');
        const metadataJson = entry.metadata ? JSON.stringify(entry.metadata, null, 2) : '{}';

        return `
          <tr>
            <td class="time-cell">${new Date(entry.timestamp).toLocaleTimeString()} <br><small style="opacity:0.7">${new Date(entry.timestamp).toLocaleDateString()}</small></td>
            <td><code style="color: var(--accent-blue); font-size:0.8rem;">${entry.conversation_id}</code></td>
            <td><span class="action-badge ${actionClass}">${entry.action_type}</span></td>
            <td style="max-width:340px; line-height:1.4;">${escapeHtml(entry.reasoning || '')}</td>
            <td class="${outcomeClass}">${entry.outcome || 'N/A'}</td>
            <td><pre class="code-block">${escapeHtml(metadataJson)}</pre></td>
          </tr>
        `;
      }).reverse().join(''); // Show newest first
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Auto-fetch on page load
    fetchAuditLogs();
  </script>
</body>
</html>
